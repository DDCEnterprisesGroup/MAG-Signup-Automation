<!doctype html>
<html><body>
  <form id="dob-phone-form">
    <label>Full Name <input autocomplete="name" name="full_name"></label>
    <label>Date of Birth (MM/DD/YYYY) <input name="dob_text" placeholder="MM/DD/YYYY"></label>
    <label>Birth date <input name="dob_native" type="date"></label>
    <label>Phone <input name="phone_digits" type="tel" value="4024876702"></label>
    <label>Mobile Phone <input name="phone_country" type="tel" value="+1 402 487 6702"></label>
    <label>Work Phone <input name="phone_other" type="tel" value="(305) 555-0100"></label>
    <label>Contact Phone <input name="phone_empty" type="tel"></label>
  </form>
</body></html>
