<!doctype html>
<html><body>
  <form id="signup">
    <label>Email <input name="email" type="email"></label>
    <label>Password <input name="new_password" type="password" autocomplete="new-password"></label>
    <label>Confirm password <input name="confirm_password" type="password"></label>
    <input name="honeypot_password" type="password" style="display:none">
    <label>Disabled <input name="disabled_password" type="password" disabled></label>
  </form>
  <form id="login">
    <label>Existing password <input name="current_password" type="password" autocomplete="current-password"></label>
  </form>
</body></html>
