<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Simple contact fixture</title><link rel="stylesheet" href="fixture.css"></head><body>
<h1>Contact our newsroom</h1><form action="#manual-submission-only"><label>Contact name <input name="contact_name" autocomplete="name" required></label><label>Email address <input name="email" type="email" autocomplete="email" required></label><label>Phone number <input name="phone" type="tel" autocomplete="tel"></label><label>Organization name <input name="organization" autocomplete="organization"></label><label>Comments <textarea name="comments"></textarea></label><button type="submit">Submit manually</button></form>
</body></html>
