<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Event calendar fixture</title><link rel="stylesheet" href="fixture.css"></head><body>
<h1>Community calendar listing</h1><form action="#manual-submission-only"><label>Event name <input name="event_title" required></label><label>Event date <input name="event_date" type="date" required></label><label>Start time <input name="start_time" type="time"></label><label>End time <input name="end_time" type="time"></label><label>Venue name <input name="venue" required></label><label>City <input name="city"></label><label>State <select name="state"><option value="">Choose</option><option value="FL">Florida</option><option value="GA">Georgia</option></select></label><label>Event description <textarea name="event_description" required></textarea></label><button type="submit">Add event manually</button></form>
</body></html>
