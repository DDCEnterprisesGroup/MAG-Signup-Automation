<!doctype html>
<html><body>
  <form id="person-form">
    <label>First Name <input autocomplete="given-name" name="given_name"></label>
    <label>Middle Name <input autocomplete="additional-name" name="middle_name"></label>
    <label>Last Name <input autocomplete="family-name" name="family_name"></label>
    <label>Full Name <input autocomplete="name" name="full_name"></label>
    <label>Email <input autocomplete="email" name="email" type="email"></label>
    <label>Mobile <input autocomplete="tel" name="mobile" type="tel"></label>
    <label>Date of Birth <input autocomplete="bday" name="dob" type="date"></label>
    <label>XXX-XX-XXXX <input id="ssn" name="ssn"></label>
    <label>Address Line 1 <input autocomplete="address-line1" name="street"></label>
    <label>Address Line 2 <input autocomplete="address-line2" name="unit"></label>
    <label>City <input autocomplete="address-level2" name="city"></label>
    <label>State <input autocomplete="address-level1" name="state"></label>
    <label>ZIP Code <input autocomplete="postal-code" name="postal"></label>
    <label>Full Address <input name="full_address"></label>
  </form>
</body></html>
